name: Build TWRP for TCL 8492A

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Device Tree
      uses: actions/checkout@v4
      with:
        path: device/tcl/8492A

    - name: Set up Build Environment & Install Repo
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git-core gnupg flex bison build-essential zip curl zlib1g-dev \
          gcc-multilib g++-multilib libc6-dev-i386 libncurses-dev lib32ncurses-dev \
          x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev \
          libxml2-utils xsltproc unzip fontconfig python3 python-is-python3
        
        # Install repo binary
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo
        
        # Configure Git identity
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        
    - name: Initialize TWRP Workspace
      run: |
        mkdir ~/twrp
        cd ~/twrp
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
        
        # Optimized sync to prevent GitHub runner disk space exhaustion
        repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune --force-sync -j$(nproc --all)

    - name: Copy Device Tree
      run: |
        cp -r $GITHUB_WORKSPACE/device ~/twrp/

    - name: Build TWRP (A/B Boot Image)
      run: |
        cd ~/twrp
        export ALLOW_MISSING_DEPENDENCIES=true
        source build/envsetup.sh
        lunch 8492A-eng
        mka bootimage

    - name: Upload Output
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-8492A-boot
        # Use absolute path for upload-artifact compatibility
        path: /home/runner/twrp/out/target/product/8492A/boot.img
        if-no-files-found: warn
